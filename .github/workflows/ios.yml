name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    env:
      ORG_GRADLE_JVMARGS: -Xmx4g
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shared framework for iOS Simulator
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 --no-daemon

      - name: Run iOS unit tests
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon --console=plain

      - name: Upload iOS test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: shared/build/reports/tests/

      - name: Build iOS app (Release)
        run: |
          xcodebuild build \
            -project iosApp/LanguageCards.xcodeproj \
            -scheme LanguageCards \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=latest' \
            -derivedDataPath ./build \
            ARCHS=arm64

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/Build/Products/Release-iphonesimulator/
