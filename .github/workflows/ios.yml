name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shared framework for iOS Simulator
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 --no-daemon

      - name: Run iOS unit tests
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon --console=plain

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: shared/build/reports/tests/

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project iosApp/LanguageCards.xcodeproj \
            -scheme LanguageCards \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/
